@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-1.6px) rotate(-3deg); } 40%, 80% { transform: translateX(1.6px) rotate(3deg); } }
@keyframes yawn { 0%, 70%, 100% { opacity: 0; transform: scale(.4); } 78%, 90% { opacity: 1; transform: scale(1); } }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -16px); } }
/* радуется наведению: глаза-звёзды крупнее и лёгкий подскок */
.buddy:hover .b-eyewrap { transform: scale(1.25); }
.buddy:hover .b-body { animation: hop .55s var(--ease); }
/* реакции на состояние обхода */
body[data-power="partial"] .b-body { transform: rotate(-9deg); }                  /* озадачен: голова набок, */
body[data-power="partial"] .b-eyewrap.r { transform: scale(.62); }                /* один глаз меньше */
body[data-power="error"] .b-body { animation: shake 1.6s ease-in-out infinite; }  /* встревожен */
body[data-power="error"] .b-eyewrap { transform: scale(1.3); }
body[data-power="error"] .b-tint { opacity: .12; }
.buddy-wrap[data-mood="joy"] .b-body { animation: hop .6s var(--ease) 2; }        /* включили обход — вспых звёзд */
.buddy-wrap[data-mood="joy"] .b-eyewrap { transform: scale(1.45) rotate(45deg); }
.buddy-wrap[data-mood="joy"] .b-eye { fill: #6D7FF0; filter: drop-shadow(0 0 2px #9DB4FF); }
.buddy-wrap:is([data-mood="joy"], [data-mood="happy"]) .b-mouth { opacity: 1; }
.buddy-wrap:is([data-mood="joy"], [data-mood="happy"]) .b-blush { opacity: calc(var(--blush, .22) * 2); }
.buddy-wrap[data-mood="happy"] .b-body { animation: nod .7s ease-in-out; }       /* благодарит и кивает */
.buddy-wrap[data-mood="bored"] .b-eyewrap { transform: scale(1, .5); }            /* скучает: глаза полуприкрыты, зевает */
.buddy-wrap[data-mood="bored"] .b-yawn { animation: yawn 6s ease-in-out infinite; }
.buddy-wrap[data-mood="sleep"] .b-eyewrap { transform: scale(1, .14); }           /* уснул */
.buddy-wrap[data-mood="sleep"] .b-eye { animation: none; }
.buddy-wrap[data-mood="sleep"] .b-zzz text { animation: zzz 2.4s ease-in-out infinite; }
.buddy-wrap[data-mood="sleep"] .b-zzz text + text { animation-delay: 1.2s; }
.buddy-wrap[data-mood="sleep"] .b-zzz { opacity: 1; }
.buddy-wrap[data-mood="sleep"] .buddy-float { animation-duration: 7s; }
/* ---- игра с NIXY: запасные лица и реакции */
.b-x, .b-spiral path { fill: none; stroke: #1A1F4D; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s ease; }
.b-spiral path { stroke-width: 1.8; transform-box: fill-box; transform-origin: center; }
.b-heart { fill: #F08BB0; opacity: 0; transform-box: fill-box; transform-origin: center; }
.buddy { touch-action: none; cursor: grab; }
.buddy-wrap.drag .buddy { cursor: grabbing; }
/* обиделся: сальто, глаза «> <», потом дуется — отвернулся */
.buddy-wrap:is([data-mood="ouch"], [data-mood="sulk"]) .b-eyes { opacity: 0; }
.buddy-wrap[data-mood="ouch"] .b-x { opacity: 1; }
.buddy-wrap[data-mood="ouch"] .buddy { animation: flip .8s var(--ease); }
.buddy-wrap[data-mood="sulk"] .b-x { opacity: .9; }
.buddy-wrap[data-mood="sulk"] .buddy { transform: rotate(8deg) scaleX(.94); }
.buddy-wrap[data-mood="sulk"] .b-body { transform: translateX(-3px); }
/* голова кружится: спирали вместо глаз и покачивание */
.buddy-wrap[data-mood="dizzy"] .b-eyes { opacity: 0; }
.buddy-wrap[data-mood="dizzy"] .b-spiral path { opacity: 1; animation: spin 1.2s linear infinite; }
.buddy-wrap[data-mood="dizzy"] .buddy { animation: wobble 1.1s ease-in-out infinite; }
/* тащат мышью: глаза круглые от удивления, рот «о» */
.buddy-wrap[data-mood="drag"] .b-eyewrap { transform: scale(1.3); }
.buddy-wrap[data-mood="drag"] .b-yawn { opacity: 1; transform: scale(.8); }
.buddy-wrap.drag { transition: none; }
.buddy-wrap.drag .buddy { transform: rotate(var(--tilt, 0deg)); transition: transform .12s linear; }
.buddy-wrap.drag .buddy-shadow { opacity: .25; }
/* проснулся от щелчка: зевает */
.buddy-wrap[data-mood="yawn"] .b-eyewrap { transform: scale(1, .3); }
.buddy-wrap[data-mood="yawn"] .b-yawn { opacity: 1; transform: scale(1.25); transition: transform .3s var(--spring); }
/* гладят: жмурится от удовольствия, румянец и сердечко */
.buddy-wrap[data-mood="pet"] .b-eyewrap { transform: scale(1.05, .32); }
.buddy-wrap[data-mood="pet"] .b-blush { opacity: calc(var(--blush, .22) * 2.4); }
.buddy-wrap[data-mood="pet"] .b-mouth { opacity: 1; }
.buddy-wrap[data-mood="pet"] .b-heart { animation: heart 1.6s ease-out; }
@keyframes flip { 0% { transform: none; } 35% { transform: translateY(-18px) rotate(-180deg); } 70% { transform: translateY(-6px) rotate(-340deg); } 100% { transform: rotate(-360deg); } }
@keyframes wobble { 25% { transform: rotate(-9deg) translateX(-2px); } 75% { transform: rotate(9deg) translateX(2px); } }
@keyframes heart { 0% { opacity: 0; transform: translateY(4px) scale(.5); } 25% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px) scale(1.1); } }

/* мягкое звёздное кольцо вокруг того, о чём идёт речь */
.buddy-target { outline: 2px solid color-mix(in srgb, var(--accent) 75%, transparent) !important; outline-offset: 4px; animation: target-glow 1.6s ease-in-out infinite; }
@keyframes target-glow { 50% { outline-color: color-mix(in srgb, var(--light) 50%, transparent); outline-offset: 6px; } }
/* пузырь-чат в стиле мессенджера: угол к помощнику менее скруглён */
.bubble {
  position: fixed; left: 0; top: 0; z-index: 37; width: max-content; max-width: 300px; min-width: 200px; padding: 13px 14px 12px; border-radius: 18px;
  background: var(--glass); backdrop-filter: blur(30px) saturate(1.6); box-shadow: 0 0 0 1px var(--line), 0 24px 50px -20px rgba(0, 0, 0, .55);
  opacity: 0; visibility: hidden; transform: translateY(6px) scale(.96); transition: opacity .2s ease, transform .35s var(--spring), visibility 0s .35s;
}
.bubble.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.bubble[data-side="right"] { border-top-left-radius: 6px; }
.bubble[data-side="left"] { border-top-right-radius: 6px; }
.bubble[data-side="below"] { border-top-left-radius: 6px; }
.bubble[data-side="above"] { border-bottom-left-radius: 6px; }
.bubble-text { padding-right: 20px; font-size: 14px; line-height: 1.45; white-space: pre-line; min-height: 20px; }
.bubble-text.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: pulse .8s steps(1) infinite; }
.bubble-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bubble-acts:empty { display: none; }
.bubble-acts button { height: 32px; padding: 0 13px; border-radius: 999px; background: var(--fill); font-size: 13px; font-weight: 600; transition: background-color .2s, transform .3s var(--spring); }
.bubble-acts button:first-child { background: var(--accent); color: var(--on-accent); }
.bubble-acts button:hover { background: var(--fill-2); }
.bubble-acts button:first-child:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); }
.bubble-acts button:active { transform: scale(.95); }
.bubble .close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; }
.bubble .close svg { width: 11px; height: 11px; }

/* ---- узкое окно (минимум 960×540): чуть плотнее */
@media (max-width: 1040px) {
  .main-grid { grid-template-columns: minmax(0, 1fr) 360px; }
  .boost-grid { grid-template-columns: minmax(300px, 1fr) minmax(340px, 1fr); }
  .lists-grid { grid-template-columns: minmax(0, 1fr); }
}
/* невысокое окно (1120×630 и ниже): плитки чуть плотнее, чтобы правая панель влезала целиком */
@media (max-height: 680px) {
  .svc { padding-block: 6px; }
}
/* низкое окно (960×540): у правой панели остаётся воздух сверху и снизу — плитки, отступы и кнопка компактнее */
@media (max-height: 600px) {
  :root { --orb: clamp(160px, min(31vh, 25vw), 300px); }
  .main-grid { padding-block: 12px; }
  .panel { padding: 10px 12px 8px; }
  .panel-head { margin-bottom: 6px; }
  .svc { min-height: 44px; padding-block: 4px; }
  .smart-head .d { display: none; }
  .smart { padding-block: 8px; }
  .controls { margin-top: 6px; }
  .controls .row { min-height: 40px; padding-block: 5px; }
  .controls .row .d { display: none; }
  .status-sub { -webkit-line-clamp: 1; }
  .svc-more { margin-top: 4px; font-size: 11.5px; }
}

@media (prefers-reduced-motion: reduce) {
  .buddy-wrap[data-mood="think"] .b-body, .buddy-wrap[data-mood="think"] .b-think circle { animation: none; }
  *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
  .gauge-card::before, .g-glow, .g-halo, #g-down, .row.dns .ms[data-tone="wait"], .cta::after, .setup-head::before, .s-star, .s-glow { animation: none !important; }
  .s-sheen { display: none; }
  .sky-stars i { transition: opacity 1.4s ease var(--d) !important; }   /* звёзды фона — только плавное появление, без мерцания */
}
</style>

  <div class="sub" data-t="upd.sub"></div>
  <div class="vers"><span id="upd-from"></span><svg><use href="#i-arrow"/></svg><span class="new" id="upd-to"></span></div>
  <button class="disclosure" id="upd-more" aria-expanded="false"><span id="upd-more-label"></span><span class="count" id="upd-count"></span><svg><use href="#i-down"/></svg></button>
  <div class="notes"><div><ol id="upd-list"></ol><div class="empty" id="upd-empty" hidden data-t="upd.empty"></div></div></div>
  <div class="upd-acts">
    <button class="btn btn-primary" id="upd-apply" data-t="upd.apply"></button>
    <button class="btn btn-plain" id="upd-later" data-t="upd.later"></button>
  </div>
  <button class="skip" id="upd-skip" data-t="upd.skip"></button>
</div></div>
<div class="upd legal" id="legal" role="dialog" aria-modal="true" aria-labelledby="legal-title"><div class="upd-card">
  <h2 id="legal-title"></h2>
  <div class="legal-text" id="legal-text" tabindex="0"></div>
  <div class="upd-acts"><button class="btn btn-primary" id="legal-close" data-t="legal.close"></button></div>
</div></div>
<!-- ===== NIXY: белая мягкая «зефирка» без рамок, глаза — тёмные звёздочки из знака ===== -->
<div class="buddy-wrap" id="buddy-wrap" data-mood="idle"><i class="buddy-shadow"></i><div class="buddy-float">
  <button class="buddy" id="buddy" data-t-aria="buddy.name">
    <svg viewBox="0 0 96 72" aria-hidden="true">
      <defs>
        <!-- объём: сверху чисто белый, книзу — лёгкая лавандовая тень; блик слева сверху -->
        <linearGradient id="bd-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F3F5FD"/><stop offset="1" stop-color="#D9DFF3"/></linearGradient>
        <radialGradient id="bd-shine" cx=".3" cy=".22" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <g class="b-body">
        <rect x="6" y="8" width="84" height="56" rx="26" fill="url(#bd-face)"/>
        <rect x="6" y="8" width="84" height="56" rx="26" fill="url(#bd-shine)"/>
        <rect class="b-tint" x="6" y="8" width="84" height="56" rx="26"/>
        <ellipse class="b-blush" cx="19" cy="47" rx="5.5" ry="3"/><ellipse class="b-blush" cx="77" cy="47" rx="5.5" ry="3"/>
        <g class="b-eyes">
          <g class="b-eyewrap l"><path class="b-eye" d="M34 24.5c.85 6.5 3.55 9.2 10 10-6.45.85-9.15 3.55-10 10-.85-6.45-3.55-9.15-10-10 6.45-.8 9.15-3.5 10-10Z"/></g>
          <g class="b-eyewrap r"><path class="b-eye" d="M62 24.5c.85 6.5 3.55 9.2 10 10-6.45.85-9.15 3.55-10 10-.85-6.45-3.55-9.15-10-10 6.45-.8 9.15-3.5 10-10Z"/></g>
        </g>
        <path class="b-mouth" d="M44 51.5q4 3.4 8 0"/>
        <ellipse class="b-yawn" cx="48" cy="53" rx="3.2" ry="2.8"/>
        <!-- запасные лица: «> <» — обиделся, спирали — голова кружится -->
        <path class="b-x" d="M27 28.5 37 34.5 27 40.5M69 28.5 59 34.5 69 40.5"/>
        <g class="b-spiral"><path d="M34 34.5m-1 0a1 1 0 1 1 2 0a2.2 2.2 0 1 1-4.4 0a3.6 3.6 0 1 1 7.2 0a5 5 0 1 1-10 0"/><path d="M62 34.5m-1 0a1 1 0 1 1 2 0a2.2 2.2 0 1 1-4.4 0a3.6 3.6 0 1 1 7.2 0a5 5 0 1 1-10 0"/></g>
      </g>
      <path class="b-heart" d="M84 20c-2.2-2.6-6-1-5.2 1.8.5 1.8 2.9 3.4 5.2 5 2.3-1.6 4.7-3.2 5.2-5C90 19 86.2 17.4 84 20Z"/>
      <g class="b-zzz"><text x="84" y="10">z</text><text x="92" y="0" font-size="10">z</text></g>
      <g class="b-think"><circle cx="72" cy="3" r="2.3"/><circle cx="80.5" cy="1" r="2.3"/><circle cx="89" cy="3" r="2.3"/></g>
    </svg>
  </button>
</div></div>
<div class="bubble" id="bubble" role="dialog" aria-live="polite" aria-labelledby="bubble-text">
  <button class="close" id="bubble-close" data-t-aria="diag.close"><svg><use href="#i-close"/></svg></button>
  <div class="bubble-text" id="bubble-text"></div>
  <div class="bubble-acts" id="bubble-acts"></div>
</div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div data-t="offline"></div></div>

<script src="app.js"></script>
</body>
</html>
