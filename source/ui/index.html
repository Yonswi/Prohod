<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Prohod</title>
<style>
/* цвет сияния за кнопкой плавно перетекает между состояниями */
@property --hc { syntax: "<color>"; inherits: true; initial-value: rgba(0, 0, 0, 0); }

:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .2);
  --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2; --sep: rgba(60, 60, 67, .13);
  --blue: #0071E3; --green: #34C759; --orange: #FF9500; --red: #FF3B30;
  --purple: #AF52DE; --indigo: #5856D6; --teal: #30B0C7; --gray: #8E8E93;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px -12px rgba(0, 0, 0, .12);
  --scrim: rgba(0, 0, 0, .28); --glass: rgba(255, 255, 255, .8);
  --btn-top: #FFFFFF; --btn-bot: #EFEFF4; --btn-edge: rgba(255, 255, 255, .9); --btn-shadow: rgba(0, 0, 0, .3); --btn-icon: #8E8E93;
  --on-top: #4CD964; --on-bot: #28B04A; --halo-off: rgba(142, 142, 147, .14);
  --ease: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .32);
    --text: #F5F5F7; --text-2: #98989D; --text-3: #636366; --sep: rgba(84, 84, 88, .45);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
    --purple: #BF5AF2; --indigo: #5E5CE6; --teal: #40C8E0; --gray: #8E8E93;
    --shadow: 0 0 0 .5px rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .55); --glass: rgba(30, 30, 32, .82);
    --btn-top: #2E2E31; --btn-bot: #1A1A1C; --btn-edge: rgba(255, 255, 255, .1); --btn-shadow: rgba(0, 0, 0, .7); --btn-icon: #636366;
    --on-top: #3BE06E; --on-bot: #1F9E43; --halo-off: rgba(142, 142, 147, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .32);
  --text: #F5F5F7; --text-2: #98989D; --text-3: #636366; --sep: rgba(84, 84, 88, .45);
  --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
  --purple: #BF5AF2; --indigo: #5E5CE6; --teal: #40C8E0; --gray: #8E8E93;
  --shadow: 0 0 0 .5px rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .55); --glass: rgba(30, 30, 32, .82);
  --btn-top: #2E2E31; --btn-bot: #1A1A1C; --btn-edge: rgba(255, 255, 255, .1); --btn-shadow: rgba(0, 0, 0, .7); --btn-icon: #636366;
  --on-top: #3BE06E; --on-bot: #1F9E43; --halo-off: rgba(142, 142, 147, .1);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden; user-select: none;
  font: 15px/1.35 -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
  transition: background-color .3s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
svg { width: 20px; height: 20px; flex: none; }
[hidden] { display: none !important; }

/* ---- экраны: переход как в iOS */
.app { position: relative; z-index: 1; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 16px 24px;
  display: flex; flex-direction: column;
  transform: translateX(100%); opacity: 0; visibility: hidden;
  transition: transform .5s var(--ease), opacity .3s ease, visibility 0s .5s;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen > * { flex-shrink: 0; }  /* длинный экран прокручивается, а не сжимает блоки */
.screen.back { transform: translateX(-28%); }
.screen.active { transform: none; opacity: 1; visibility: visible; transition: transform .5s var(--ease), opacity .3s ease; }

/* ---- шапка */
.bar { display: flex; align-items: center; min-height: 44px; gap: 8px; position: relative; z-index: 2; }
.bar .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.bar .brand svg { width: 26px; height: 26px; }
.bar .spacer { flex: 1; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); color: var(--text-2); transition: background-color .2s, transform .3s var(--ease);
}
.icon-btn:hover { background: var(--fill-2); }
.icon-btn:hover svg { transform: rotate(45deg); }
.icon-btn svg { width: 19px; height: 19px; transition: transform .5s var(--ease); }
.icon-btn:active { transform: scale(.92); }
.back-link { display: flex; align-items: center; gap: 2px; color: var(--blue); font-size: 17px; margin-left: -6px; padding: 4px 6px; border-radius: 8px; }
.back-link svg { width: 22px; height: 22px; }
.bar-action { color: var(--blue); font-size: 17px; padding: 4px 6px; border-radius: 8px; }
.large-title { font-size: 32px; font-weight: 700; letter-spacing: -.03em; margin: 6px 4px 18px; }

/* ---- главная: кнопка питания со стеклом, сиянием и волнами */
.hero { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 0 26px; min-height: 480px; }
.orb { position: relative; width: 176px; height: 176px; display: grid; place-items: center; --hc: var(--halo-off); }
.orb[data-state="on"] { --hc: color-mix(in srgb, var(--green) 30%, transparent); }
.orb[data-state="starting"] { --hc: color-mix(in srgb, var(--blue) 22%, transparent); }
.orb[data-state="error"] { --hc: color-mix(in srgb, var(--orange) 24%, transparent); }
.halo {
  position: absolute; inset: -120px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--hc), transparent 72%);
  transition: --hc .7s ease, transform .7s var(--ease), opacity .7s ease;
}
.orb[data-state="on"] .halo { animation: breathe 4s ease-in-out infinite; }
.orb.pop .halo { animation: pop .9s var(--ease); }
@keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .8; } 50% { transform: scale(1.04); opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 45% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); } }
.wave { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--green); opacity: 0; pointer-events: none; }
.orb[data-state="on"] .wave { animation: wave 3.9s cubic-bezier(.2, .6, .3, 1) infinite; }
.orb[data-state="on"] .wave:nth-of-type(2) { animation-delay: 1.3s; }
.orb[data-state="on"] .wave:nth-of-type(3) { animation-delay: 2.6s; }
@keyframes wave { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(1.8); opacity: 0; } }

/* капсула «Подобрать автоматически» прямо под кнопкой */
.pill {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; height: 36px; margin-top: 30px; padding: 0 16px 0 13px;
  border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--blue);
  background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 38%, transparent), 0 6px 18px -10px color-mix(in srgb, var(--blue) 60%, transparent);
  transition: transform .35s var(--spring), background-color .2s, color .3s, box-shadow .3s;
}
.pill svg { width: 15px; height: 15px; }
.pill:hover:not(:disabled) { transform: translateY(-1px) scale(1.03); background: color-mix(in srgb, var(--blue) 12%, var(--card)); }
.pill:active:not(:disabled) { transform: scale(.97); }
.pill.stop { color: var(--red); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 40%, transparent), 0 6px 18px -10px color-mix(in srgb, var(--red) 60%, transparent); }
.pill.stop svg { animation: spin 2.4s linear infinite; }

/* живой фон: мягкие цветные пятна медленно плывут и окрашиваются по состоянию */
.backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .6s ease; }
body.on-main .backdrop { opacity: 1; }
.backdrop i { position: absolute; width: 340px; height: 340px; border-radius: 50%; filter: blur(70px); opacity: .22; transition: background-color 1.2s ease; }
.backdrop i:nth-child(1) { left: -120px; top: -90px; background: var(--indigo); animation: drift1 22s ease-in-out infinite; }
.backdrop i:nth-child(2) { right: -140px; top: 150px; background: var(--teal); animation: drift2 26s ease-in-out infinite; }
.backdrop i:nth-child(3) { left: 30px; bottom: -200px; background: var(--purple); opacity: .14; animation: drift1 30s ease-in-out infinite reverse; }
.backdrop[data-state="on"] i:nth-child(1), .backdrop[data-state="on"] i:nth-child(3) { background: var(--green); }
.backdrop[data-state="error"] i:nth-child(1) { background: var(--orange); }
.backdrop::after {  /* тонкая сетка точек, тающая к краям */
  content: ""; position: absolute; inset: 0; opacity: .55;
  background-image: radial-gradient(circle, var(--fill-2) 1px, transparent 1.3px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 75% 45% at 50% 33%, #000, transparent 75%);
  mask-image: radial-gradient(ellipse 75% 45% at 50% 33%, #000, transparent 75%);
}
@keyframes drift1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 50px) scale(1.15); } }
@keyframes drift2 { 0%, 100% { transform: translate(0, 0) scale(1.1); } 50% { transform: translate(-70px, -40px) scale(.95); } }

/* кольцо: вращается при запуске, честно заполняется при подборе */
.ring { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); pointer-events: none; opacity: 0; transition: opacity .3s ease; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: var(--fill); }
.ring .arc { stroke: var(--blue); stroke-linecap: round; stroke-dasharray: 597; stroke-dashoffset: 448; transition: stroke-dashoffset .6s var(--ease); }
.orb[data-state="starting"] .ring { opacity: 1; }
.orb[data-state="starting"]:not(.auto) .ring { animation: spin-ring 1.1s linear infinite; }
.orb[data-state="starting"]:not(.auto) .ring .track { stroke: transparent; }
@keyframes spin-ring { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

.power {
  position: relative; width: 176px; height: 176px; border-radius: 50%; overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); color: var(--btn-icon);
  box-shadow: inset 0 1px 0 var(--btn-edge), 0 0 0 .5px var(--sep), 0 2px 4px -2px var(--btn-shadow), 0 22px 46px -22px var(--btn-shadow);
  display: grid; place-items: center;
  transition: color .4s ease, box-shadow .6s var(--ease), transform .35s var(--ease);
}
.power:hover:not(:disabled) { transform: scale(1.025); }
.power:active:not(:disabled) { transform: scale(.96); }
.power .fill {  /* зелёный растекается из центра с пружинкой */
  position: absolute; inset: 0; z-index: -1; border-radius: 50%;
  background: linear-gradient(180deg, var(--on-top), var(--on-bot));
  clip-path: circle(0% at 50% 50%); transition: clip-path .7s var(--spring);
}
.power .shine {  /* стеклянный блик сверху */
  position: absolute; inset: 0; z-index: 1; border-radius: 50%; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .06) 46%, transparent 50%);
  opacity: .55; transition: opacity .5s ease;
}
.power svg { position: relative; z-index: 2; width: 60px; height: 60px; transition: transform .8s var(--ease); }
.power[data-state="on"] { color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 24px 54px -18px color-mix(in srgb, var(--green) 80%, transparent); }
.power[data-state="on"] .fill { clip-path: circle(75% at 50% 50%); }
.power[data-state="on"] .shine { opacity: 1; }
.power[data-state="on"] svg { transform: rotate(360deg); }
.power[data-state="error"] { color: var(--orange); }
.power[data-state="starting"] { color: var(--blue); }

.status-title { margin-top: 22px; font-size: 26px; font-weight: 600; letter-spacing: -.025em; }
.status-sub { margin-top: 6px; font-size: 15px; color: var(--text-2); max-width: 320px; min-height: 20px; }
.uptime {
  height: 24px; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 4px 11px 4px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--green) 13%, transparent); color: var(--green);
  font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums;
  opacity: 0; transform: translateY(-4px); transition: opacity .4s ease, transform .5s var(--ease);
}
.uptime.show { opacity: 1; transform: none; }
.uptime i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* сервисы: значок, имя и бейдж состояния */
.services { display: flex; gap: 10px; margin-top: 18px; }
.svc {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 9px; border-radius: 14px;
  background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 500;
}
.svc > svg { width: 22px; height: 22px; }
.svc .note { color: var(--text-2); font-weight: 400; font-size: 12.5px; font-variant-numeric: tabular-nums; margin-left: -3px; }
.badge { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: #fff; transition: background-color .3s ease; }
.badge svg { width: 11px; height: 11px; display: none; }
.badge .draw { stroke-dasharray: 24; stroke-dashoffset: 24; }
.svc[data-tone="ok"] .badge { background: var(--green); }
.svc[data-tone="ok"] .b-ok { display: block; }
.svc[data-tone="ok"] .draw { animation: draw .45s .1s var(--ease) forwards; }
.svc[data-tone="warn"] .badge { background: var(--orange); }
.svc[data-tone="warn"] .b-warn { display: block; }
.svc[data-tone="bad"] .badge { background: var(--red); }
.svc[data-tone="bad"] .b-bad { display: block; }
.svc[data-tone="wait"] .badge { background: var(--fill-2); animation: blink 1s ease-in-out infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---- сгруппированные списки с цветными плитками, как в «Настройках» iPhone */
.group { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.group-label { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .02em; margin: 26px 16px 7px; }
.foot { font-size: 13px; color: var(--text-2); margin: 7px 16px 0; line-height: 1.4; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px;
  padding: 9px 14px; text-align: left; transition: background-color .15s;
}
.row + .row::before, .hashes + .row::before { content: ""; position: absolute; top: 0; left: 55px; right: 0; height: .5px; background: var(--sep); }
.row.plain + .row::before, .row + .row.plain::before { left: 14px; }
button.row:hover:not(:disabled) { background: var(--fill); }
button.row:active:not(:disabled) { background: var(--fill-2); }
.row .label { flex: 1; min-width: 0; }
.row .label .d { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
.row .value { color: var(--text-2); max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { width: 13px; height: 13px; color: var(--text-3); margin-right: -2px; transition: transform .3s var(--ease); }
.tile {
  width: 29px; height: 29px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff;
  background: var(--c, var(--gray));
  box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .35), 0 1px 2px color-mix(in srgb, var(--c, var(--gray)) 40%, transparent);
  transition: transform .35s var(--spring), background-color .3s;
}
.tile svg { width: 17px; height: 17px; }
button.row:hover:not(:disabled) .tile { transform: scale(1.06); }
.row.accent .label > div:first-child { color: var(--blue); font-weight: 500; }
.row.accent.stop .label > div:first-child { color: var(--red); }
.row.accent.stop .tile { background: var(--red); }
.row.accent.stop .tile svg { animation: spin 2.4s linear infinite; }
.row.danger { color: var(--red); justify-content: center; font-weight: 500; }

/* переключатель как в iOS */
.switch {
  position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--fill-2); flex: none;
  transition: background-color .25s ease;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16);
  transition: transform .35s var(--spring);
}
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* сегменты */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; transition: background-color .2s, box-shadow .2s; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #636366; } }
.row.stack { flex-wrap: wrap; row-gap: 10px; }
.row.stack .seg, .row.stack .d { width: 100%; margin-left: 41px; }
.row.stack .d { font-size: 12.5px; color: var(--text-2); margin-top: -2px; }

/* целостность движка */
.hashes { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 2px 16px 14px 55px; font-size: 12px; }
.hashes .k { color: var(--text-2); }
.hashes .v { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hashes .v.hash { cursor: pointer; }
.hashes .v.hash:hover { color: var(--blue); }

.facts { list-style: none; padding: 4px 0; }
.facts li { position: relative; display: flex; gap: 12px; padding: 10px 14px; font-size: 14px; }
.facts li + li::before { content: ""; position: absolute; top: 0; left: 55px; right: 0; height: .5px; background: var(--sep); }
.facts .d { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }

.about { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 22px; line-height: 1.6; }
.about svg { width: 34px; height: 34px; display: block; margin: 0 auto 6px; opacity: .9; }

/* ---- журнал */
.log {
  flex: 0 1 auto; min-height: 120px; overflow-y: auto; padding: 12px 14px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
  font: 12.5px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; user-select: text;
  scrollbar-width: thin; scrollbar-color: var(--fill-2) transparent;
}
#s-log { overflow: hidden; }
#s-log .log { flex-shrink: 1; }
.ln { display: flex; gap: 10px; }
.ln .tm { color: var(--text-3); flex: none; }
.ln .msg { overflow-wrap: break-word; min-width: 0; }
.ln .ok { color: var(--green); }
.ln .err { color: var(--red); }
.ln .engine { color: var(--text-2); }

/* ---- установка */
.setup { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 12px 0; }
.setup-head { position: relative; text-align: center; margin-bottom: 30px; }
.setup-head::before {
  content: ""; position: absolute; left: 50%; top: 38px; width: 300px; height: 300px; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--indigo) 20%, transparent), transparent 70%);
  animation: breathe 5s ease-in-out infinite;
}
.setup-head svg { position: relative; width: 76px; height: 76px; filter: drop-shadow(0 12px 24px rgba(80, 90, 240, .35)); }
.setup-head h1 { position: relative; font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin-top: 18px; }
.setup-head p { position: relative; color: var(--text-2); margin-top: 6px; }
.step .mark { width: 29px; height: 29px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--text-2); font-size: 13px; font-weight: 600; flex: none; position: relative; transition: background-color .3s; }
.step .mark svg { width: 15px; height: 15px; display: none; }
.steps .row + .row::before { left: 55px; }
.steps[data-step="1"] .step[data-n="1"] .mark,
.steps[data-step="2"] .step[data-n="2"] .mark,
.steps[data-step="3"] .step[data-n="3"] .mark { color: transparent; background: none; }
.steps[data-step="1"] .step[data-n="1"] .mark::after,
.steps[data-step="2"] .step[data-n="2"] .mark::after,
.steps[data-step="3"] .step[data-n="3"] .mark::after {
  content: ""; position: absolute; inset: 1px; border-radius: 50%; border: 2.5px solid var(--fill-2); border-top-color: var(--blue); animation: spin .9s linear infinite;
}
.steps[data-step="2"] .step[data-n="1"] .mark,
.steps[data-step="3"] .step[data-n="1"] .mark,
.steps[data-step="3"] .step[data-n="2"] .mark,
.steps[data-done] .step .mark { background: var(--green); color: #fff; font-size: 0; }
.steps[data-step="2"] .step[data-n="1"] .mark svg,
.steps[data-step="3"] .step[data-n="1"] .mark svg,
.steps[data-step="3"] .step[data-n="2"] .mark svg,
.steps[data-done] .step .mark svg { display: block; }
.steps[data-done] .step .mark::after { display: none; }
.progress { height: 3px; background: var(--fill); overflow: hidden; display: none; }
.progress i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s ease; }
.setup-status { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 16px; min-height: 20px; white-space: pre-line; }
.setup-status[data-tone="ok"] { color: var(--green); }
.setup-status[data-tone="err"] { color: var(--red); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px;
  border-radius: 14px; font-size: 17px; font-weight: 600; transition: transform .2s var(--ease), background-color .2s, opacity .2s;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--blue) 88%, #000); }
.btn-plain { background: var(--fill); color: var(--blue); }
.btn-plain:hover:not(:disabled) { background: var(--fill-2); }
.setup-actions { display: grid; gap: 10px; margin-top: 18px; }

/* ---- список стратегий: непрозрачный, с тонкой прокруткой */
.popover {
  position: fixed; z-index: 20; overflow-y: auto; padding: 6px; border-radius: 14px; background: var(--card);
  box-shadow: 0 0 0 .5px var(--sep), 0 22px 60px -14px rgba(0, 0, 0, .4);
  opacity: 0; transform: scale(.96); pointer-events: none;
  transition: opacity .18s ease, transform .3s var(--ease);
  scrollbar-width: thin; scrollbar-color: var(--fill-2) transparent;
}
.popover.open { opacity: 1; transform: none; pointer-events: auto; }
.popover button { display: flex; align-items: center; width: 100%; padding: 9px 12px; border-radius: 9px; text-align: left; font-size: 15px; }
.popover button:hover { background: var(--fill); }
.popover button span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.popover button svg { width: 16px; height: 16px; color: var(--blue); }
.popover button[aria-selected="true"] { font-weight: 600; }

/* ---- диалог как в iOS */
.scrim {
  position: fixed; inset: 0; z-index: 30; background: var(--scrim);
  display: flex; align-items: center; justify-content: center; padding: 32px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.alert {
  width: 100%; max-width: 290px; border-radius: 16px; overflow: hidden;
  background: var(--glass); backdrop-filter: blur(40px) saturate(1.8); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45);
  transform: scale(1.1); opacity: 0; transition: transform .35s var(--ease), opacity .2s ease;
}
.scrim.open .alert { transform: none; opacity: 1; }
.alert p { padding: 20px 18px 18px; text-align: center; font-size: 14px; line-height: 1.45; white-space: pre-line; }
.alert .acts { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid var(--sep); }
.alert .acts.one { grid-template-columns: 1fr; }
.alert .acts button { height: 46px; color: var(--blue); font-size: 17px; }
.alert .acts button + button { border-left: .5px solid var(--sep); }
.alert .acts button.strong { font-weight: 600; }
.alert .acts button:hover:not(:disabled) { background: var(--fill); }

/* ---- обновление: лист снизу */
.upd { position: fixed; inset: 0; z-index: 25; display: flex; align-items: flex-end; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.upd.open { opacity: 1; pointer-events: auto; }
.upd-card {
  width: 100%; max-width: 520px; margin: 0 auto; padding: 8px 20px 22px; border-radius: 22px 22px 0 0;
  background: var(--card); transform: translateY(100%); transition: transform .5s var(--ease); max-height: 92%; overflow-y: auto;
}
.upd.open .upd-card { transform: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 18px; }
.upd-icon { width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, #3D9BFF, #0060DF); box-shadow: 0 10px 24px -10px rgba(0, 113, 227, .7); }
.upd-icon svg { width: 28px; height: 28px; }
.upd h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-align: center; }
.upd .sub { text-align: center; color: var(--text-2); font-size: 14px; margin-top: 4px; }
.vers { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px 0 14px; font-size: 17px; font-variant-numeric: tabular-nums; }
.vers span { padding: 4px 11px; border-radius: 999px; background: var(--fill); }
.vers .new { color: var(--blue); font-weight: 600; background: color-mix(in srgb, var(--blue) 12%, transparent); }
.vers svg { width: 16px; height: 16px; color: var(--text-3); }
.disclosure { display: flex; align-items: center; width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--fill); font-weight: 500; }
.disclosure span { flex: 1; text-align: left; }
.disclosure svg { width: 14px; height: 14px; color: var(--text-2); transition: transform .3s var(--ease); }
.upd.expanded .disclosure svg { transform: rotate(180deg); }
.notes { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.upd.expanded .notes { grid-template-rows: 1fr; }
.notes > div { overflow: hidden; }
.notes ol { padding: 12px 6px 0 26px; font-size: 14px; color: var(--text); display: grid; gap: 7px; }
.notes .empty { padding: 12px 6px 0; font-size: 13px; color: var(--text-2); }
.upd .btn { margin-top: 18px; }
.upd .btn + .btn { margin-top: 8px; }
.upd .skip { display: block; margin: 12px auto 0; font-size: 14px; color: var(--text-2); padding: 4px 10px; border-radius: 8px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  padding: 10px 16px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: 0 0 0 .5px var(--sep), 0 10px 30px -10px rgba(0, 0, 0, .3); font-size: 13px; font-weight: 500; white-space: nowrap;
  transition: opacity .2s ease, transform .4s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.offline { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 32px; background: var(--bg); color: var(--text-2); text-align: center; }
.offline.show { display: grid; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
  .orb[data-state="on"] .wave { animation: none; opacity: .2; transform: scale(1.25); }
  .backdrop i { animation: none !important; }
}
</style>
</head>

<div class="app">

  <!-- ===== установка движка ===== -->

  </section>

  <!-- ===== настройки ===== -->
  <section class="screen" id="s-settings">
    <div class="bar"><button class="back-link" data-go="main"><svg><use href="#i-back"/></svg><span data-t="nav.back"></span></button></div>
    <div class="large-title" data-t="nav.settings"></div>

    <div class="group">
      <div class="row"><span class="tile" style="--c: var(--orange)"><svg><use href="#t-game"/></svg></span><div class="label"><div data-t="set.game"></div><div class="d" data-t="set.gamed"></div></div><button class="switch" role="switch" data-key="game" aria-checked="false" data-t-aria="set.game"></button></div>
      <div class="row"><span class="tile" style="--c: var(--green)"><svg><use href="#t-bolt"/></svg></span><div class="label"><div data-t="set.open"></div><div class="d" data-t="set.opend"></div></div><button class="switch" role="switch" data-key="open" aria-checked="false" data-t-aria="set.open"></button></div>
      <div class="row"><span class="tile" style="--c: var(--blue)"><svg><use href="#t-win"/></svg></span><div class="label"><div data-t="set.auto"></div><div class="d" data-t="set.autod"></div></div><button class="switch" role="switch" data-key="autostart" aria-checked="false" data-t-aria="set.auto"></button></div>
    </div>

    <div class="group-label" data-t="set.look"></div>
    <div class="group">
      <div class="row stack"><span class="tile" style="--c: var(--teal)"><svg><use href="#t-globe"/></svg></span><div class="label" data-t="set.lang"></div>
        <div class="seg" data-pref="lang"><button data-v="auto" data-t="set.auto_opt"></button><button data-v="ru">Русский</button><button data-v="en">English</button></div>
        <div class="d" data-t="set.langd"></div></div>
      <div class="row stack"><span class="tile" style="--c: var(--indigo)"><svg><use href="#t-theme"/></svg></span><div class="label" data-t="set.theme"></div>
        <div class="seg" data-pref="theme"><button data-v="auto" data-t="set.auto_opt"></button><button data-v="light" data-t="set.light"></button><button data-v="dark" data-t="set.dark"></button></div></div>
    </div>

    <div class="group-label" data-t="set.engine"></div>
    <div class="group">
      <div class="row"><span class="tile"><svg><use href="#t-cube"/></svg></span><span class="label" data-t="set.version"></span><span class="value" id="engine"></span></div>
      <button class="row" id="b-update"><span class="tile" style="--c: var(--blue)"><svg><use href="#t-update"/></svg></span><span class="label" data-t="set.update"></span><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="row" data-go="log"><span class="tile"><svg><use href="#t-list"/></svg></span><span class="label" data-t="set.log"></span><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="row" id="b-hashes" aria-expanded="false"><span class="tile" style="--c: var(--green)"><svg><use href="#t-shield"/></svg></span><span class="label" data-t="set.hashes"></span><svg class="chev" id="hash-chev"><use href="#i-down"/></svg></button>
      <div class="hashes" id="sec-kv" hidden></div>
      <button class="row" id="b-open"><span class="tile" style="--c: var(--teal)"><svg><use href="#t-folder"/></svg></span><span class="label" data-t="set.open_dir"></span><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="row" id="b-folder2"><span class="tile" style="--c: var(--indigo)"><svg><use href="#t-swap"/></svg></span><span class="label" data-t="set.change_dir"></span><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="row" id="b-repo"><span class="tile"><svg><use href="#t-code"/></svg></span><span class="label" data-t="set.repo"></span><span class="value">GitHub</span></button>
    </div>

    <div class="group-label" data-t="set.privacy"></div>
    <div class="group">
      <ul class="facts">
        <li><span class="tile" style="--c: var(--blue)"><svg><use href="#t-eye"/></svg></span><div><div data-t="f1"></div><div class="d" data-t="f1d"></div></div></li>
        <li><span class="tile" style="--c: var(--teal)"><svg><use href="#t-wifi"/></svg></span><div><div data-t="f2"></div><div class="d" data-t="f2d"></div></div></li>
        <li><span class="tile" style="--c: var(--green)"><svg><use href="#t-shield"/></svg></span><div><div data-t="f3"></div><div class="d" data-t="f3d"></div></div></li>
      </ul>
    </div>

    <div class="group" style="margin-top:26px"><button class="row danger" id="b-uninstall"><span data-t="set.uninstall"></span></button></div>
    <div class="about"><svg><use href="#logo"/></svg><span id="about"></span></div>
  </section>

  <!-- ===== журнал ===== -->
  <section class="screen" id="s-log">
    <div class="bar">
      <button class="back-link" data-go="settings"><svg><use href="#i-back"/></svg><span data-t="nav.settings"></span></button>
      <div class="spacer"></div>
      <button class="bar-action" id="b-copy" data-t="log.copy"></button>
    </div>
    <div class="large-title" data-t="set.log"></div>
    <div class="log" id="log"></div>
  </section>
</div>

<div class="popover" id="popover" role="listbox"></div>
<div class="scrim" id="scrim"><div class="alert" role="alertdialog" aria-modal="true">
  <p id="dlg-text"></p>
  <div class="acts" id="dlg-acts"></div>
</div></div>
<div class="upd" id="upd" role="dialog" aria-modal="true" aria-labelledby="upd-title"><div class="upd-card">
  <div class="grabber"></div>
  <div class="upd-icon"><svg><use href="#t-update"/></svg></div>
  <h2 id="upd-title" data-t="upd.title"></h2>
  <div class="sub" data-t="upd.sub"></div>
  <div class="vers"><span id="upd-from"></span><svg><use href="#i-arrow"/></svg><span class="new" id="upd-to"></span></div>
  <button class="disclosure" id="upd-more" aria-expanded="false"><span id="upd-more-label"></span><svg><use href="#i-down"/></svg></button>
  <div class="notes"><div><ol id="upd-list"></ol><div class="empty" id="upd-empty" hidden data-t="upd.empty"></div></div></div>
  <button class="btn btn-primary" id="upd-apply" data-t="upd.apply"></button>
  <button class="btn btn-plain" id="upd-later" data-t="upd.later"></button>
  <button class="skip" id="upd-skip" data-t="upd.skip"></button>
</div></div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div data-t="offline"></div></div>

<script src="app.js"></script>
</body>
</html>
